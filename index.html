<body>
<div id="app"></div>
<script>
let galSong=null,incoming=null,S=[],v='list',cur=null,tab='l',pk=null,t=0,fs=22,sp=3,timer=null,tbc=false,pv='',ins='g',onChord=null,closeP=null;
try{S=JSON.parse(localStorage.getItem('chords_songs')||'[]')}catch(e){}
try{const l0=localStorage.getItem('chords_ins');ins=l0==='p'||l0==='u'?l0:'g'}catch(e){}
const sv=()=>{try{localStorage.setItem('chords_songs',JSON.stringify(S))}catch(e){}};
const A=document.getElementById('app');
const el=(g,c,x)=>{const e=document.createElement(g);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const btn=(x,f,c,a)=>{const b=el('button',c||'b',x);b.onclick=f;if(a)b.setAttribute('aria-label',a);return b};
const stop=()=>{clearInterval(timer);timer=null};
const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
const sh0=()=>v==='ed'?0:t+(ins==='p'&&cur?cur.cp||0:0);
const tr=c=>{const k=sh0();return k?c.replace(/[A-G][#b]?/g,m=>N[(((N.indexOf(FL[m]||m)+k)%12)+12)%12]):c};
const chars=s=>Array.from(s),detect=s=>/[\u0590-\u05FF]/.test(s)?'rtl':'ltr';
const lc=(l,k)=>(l.c[k]||'').split(' ').filter(Boolean);
const pp=c=>{const m=c.match(/^([A-G])([#b]?)([^/]*)(?:\/([A-G][#b]?))?$/);return m?{root:m[1],acc:m[2],typ:m[3],bass:m[4]||''}:{cust:c}};

/*CH_START*/
const TY={'':[0,4,7],m:[0,3,7],'7':[0,4,7,10],m7:[0,3,7,10],maj7:[0,4,7,11],sus4:[0,5,7],sus2:[0,2,7],dim:[0,3,6],aug:[0,4,8],'6':[0,4,7,9],add9:[0,4,7,14]};
const OPEN=[4,9,2,7,11,4],pcOf=n=>N.indexOf(FL[n]||n);
const OP={'0|':[-1,3,2,0,1,0],'2|':[-1,-1,0,2,3,2],'7|':[3,2,0,0,0,3],'2|m':[-1,-1,0,2,3,1],'0|7':[-1,3,2,3,1,0],'2|7':[-1,-1,0,2,1,2],'7|7':[3,2,0,0,0,1],'11|7':[-1,2,1,2,0,2],'2|m7':[-1,-1,0,2,1,1],'0|maj7':[-1,3,2,0,0,0],'2|maj7':[-1,-1,0,2,2,2],'5|maj7':[-1,-1,3,2,1,0],'7|maj7':[3,2,0,0,0,2],'2|sus2':[-1,-1,0,2,3,0],'2|sus4':[-1,-1,0,2,3,3],'0|add9':[-1,3,2,0,3,0]};
const TE={'':[0,2,2,1,0,0],m:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,2,1,1,0,0],sus4:[0,2,2,2,0,0]};
const TA={'':[null,0,2,2,2,0],m:[null,0,2,2,1,0],'7':[null,0,2,0,2,0],m7:[null,0,2,0,1,0],maj7:[null,0,2,1,2,0],sus4:[null,0,2,2,3,0],sus2:[null,0,2,2,0,0],dim:[null,0,1,2,1,null],aug:[null,0,3,2,2,1],'6':[null,0,2,2,2,2],add9:[null,0,2,4,2,0]};
function gs(pc,ty){
  const o=OP[pc+'|'+ty];if(o)return{f:o,r:0};
  const c=[];
  if(TE[ty])c.push({r:(pc-4+12)%12,t:TE[ty]});
  if(TA[ty])c.push({r:(pc-9+12)%12,t:TA[ty]});
  if(!c.length)return null;
  c.sort((x,y)=>x.r-y.r);
  const b=c[0],f=b.t.map(x=>x==null?-1:x+b.r);
  let bar=-1;
  if(b.r>0){const ix=f.map((x,i)=>x===b.r?i:-1).filter(i=>i>=0);if(ix.length>=2&&ix.includes(5))bar=ix[0]}
  return{f,r:b.r,bar};
}
function gsvg(g){
  const f=g.f,pos=f.filter(x=>x>0),mn=pos.length?Math.min(...pos):1,mx=pos.length?Math.max(...pos):1,st=mx<=5?1:mn;
  const W=130,H=150,x0=24,dx=16,y0=34,dy=22,X=i=>x0+i*dx;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="תרשים אקורד בגיטרה">';
  for(let i=0;i<=5;i++)s+='<line x1="'+x0+'" y1="'+(y0+i*dy)+'" x2="'+X(5)+'" y2="'+(y0+i*dy)+'" stroke="currentColor" stroke-width="'+(i===0&&st===1?4:1)+'" opacity="'+(i===0&&st===1?1:.5)+'"/>';
  for(let i=0;i<6;i++)s+='<line x1="'+X(i)+'" y1="'+y0+'" x2="'+X(i)+'" y2="'+(y0+5*dy)+'" stroke="currentColor" stroke-width="1"/>';
  if(st>1)s+='<text x="2" y="'+(y0+dy*.7)+'" font-size="12" fill="currentColor">'+st+'</text>';
  f.forEach((v,i)=>{
    if(v<0)s+='<text x="'+X(i)+'" y="'+(y0-8)+'" font-size="12" text-anchor="middle" fill="currentColor">×</text>';
    else if(v===0)s+='<circle cx="'+X(i)+'" cy="'+(y0-11)+'" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>';
  });
  const cy=v=>y0+(v-st)*dy+dy/2;
  if(g.bar>=0)s+='<line x1="'+X(g.bar)+'" y1="'+cy(g.r)+'" x2="'+X(5)+'" y2="'+cy(g.r)+'" stroke-width="11" stroke-linecap="round" style="stroke:var(--ch)"/>';
  f.forEach((v,i)=>{if(v>0&&!(g.bar>=0&&v===g.r&&i>=g.bar))s+='<circle cx="'+X(i)+'" cy="'+cy(v)+'" r="6" style="fill:var(--ch)"/>'});
  return s+'</svg>';
}
function psvg(pc,iv,bs){
  const w=16,H=80,bw=10,W=14*w,WS=[0,2,4,5,7,9,11],BK={1:0,3:1,6:3,8:4,10:5},on=new Set();
  iv.forEach(i=>{let s=pc+i+(bs!=null?12:0);while(s>=24)s-=12;on.add(s)});
  let a='',b='';
  for(let s=0;s<24;s++){
    const o=Math.floor(s/12),p=s%12,fill=bs!=null&&s===bs?'#d97706':on.has(s)?'var(--ch)':null;
    if(BK[p]===undefined)a+='<rect x="'+((o*7+WS.indexOf(p))*w)+'" y="0" width="'+(w-1)+'" height="'+H+'" rx="2" style="fill:'+(fill||'#fff')+'" stroke="#888"/>';
    else b+='<rect x="'+((o*7+BK[p])*w+w-bw/2)+'" y="0" width="'+bw+'" height="'+(H*.6)+'" rx="2" style="fill:'+(fill||'#222')+'"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="תרשים אקורד בפסנתר">'+a+b+'</svg>';
}
const UKE=[7,0,4,9];
function us(pc,iv){
  const need=[...new Set(iv.map(i=>(pc+i)%12))];let best=null,bc=1e9;
  for(let a=0;a<=12;a++)for(let b=0;b<=12;b++)for(let c=0;c<=12;c++)for(let d=0;d<=12;d++){
    const f=[a,b,c,d],fr=f.filter(x=>x>0),mx=fr.length?Math.max(...fr):0,mn=fr.length?Math.min(...fr):0;
    if(fr.length&&mx-mn>3)continue;
    const ps=f.map((x,i)=>(UKE[i]+x)%12);
    if(ps.some(p=>!need.includes(p))||need.some(p=>!ps.includes(p)))continue;
    const cost=mx*100+(mx-mn)*10+a+b+c+d;
    if(cost<bc){bc=cost;best=f}
  }
  return best;
}
function usvg(f){
  const pos=f.filter(x=>x>0),mn=pos.length?Math.min(...pos):1,mx=pos.length?Math.max(...pos):1,st=mx<=4?1:mn;
  const W=100,H=130,x0=22,dx=18,y0=30,dy=22,X=i=>x0+i*dx;

      if(custom&&pk.root)pk.typ=inp.value.trim();
      const c=nmv(),a=lc(l,pk.k);a.splice(pk.ei,1);a.length?l.c[pk.k]=a.join(' '):delete l.c[pk.k];
      const b2=lc(l,k2);b2.push(c);l.c[k2]=b2.join(' ');pk.k=k2;pk.ei=b2.length-1;render()};
    const r1=el('div','pvr'),L=el('div','pside'),M=el('div','pmid'),R=el('div','pside r');
    if(editing)L.append(ibt('trash',del,'b ic','מחק אקורד'));
    const mv=!isC&&editing&&pk.root;
    if(mv)M.append(btn('◀',()=>mvk(-1),'b','הזז אות שמאלה'));
    M.append(nameEl);
    if(mv)M.append(btn('▶',()=>mvk(1),'b','הזז אות ימינה'));
    R.append(ibt('back',()=>{if(pk.cm)pk.cm=false;else{pk.root=null;pk.cust=''}pk.bo=pk.oo=false;render()},'b ic','חזרה'),
      ibt('ok',()=>put(nmv()),'b pr ic',editing?'שמור':'הוסף'));
    r1.append(L,M,R);
    b.append(r1);
    const cu=()=>{const w=el('div','cu');w.append(inp);setTimeout(()=>inp.focus(),0);return w};
    if(!pk.root){b.append(cu())}
    else{
      const drop=(label,on,key,items)=>{
        const w=el('div','flw');
        w.append(btn(label+(pk[key]?' ▴':' ▾'),()=>{pk[key]=!pk[key];if(pk[key])pk[key==='bo'?'oo':'bo']=false;render()},'b flb'+(on?' on':'')));
        if(pk[key]){const Ls=el('div','fl');items.forEach(([x,act,f])=>Ls.append(btn(x,()=>{pk[key]=false;f()},'b fi'+(act?' on':''))));w.append(Ls)}
        return w};
      const r2=rw('fit');
      r2.append(btn('♯',()=>{pk.acc=pk.acc==='#'?'':'#';render()},'b'+(pk.acc==='#'?' on':''),'דיאז'),
        btn('♭',()=>{pk.acc=pk.acc==='b'?'':'b';render()},'b'+(pk.acc==='b'?' on':''),'במול'),
        drop('בס'+(pk.bass?' '+pk.bass:''),!!pk.bass,'bo',[['ללא',!pk.bass,()=>{pk.bass='';render()}]].concat(N.map(x=>[x,pk.bass===x,()=>{pk.bass=x;render()}]))),
        btn('✎',()=>{pk.cm=!pk.cm;pk.bo=pk.oo=false;render()},'b'+(pk.cm?' on':''),'הקלדה חופשית'));
      b.append(r2);
      if(custom)b.append(cu());
      else{
        const MAIN=['','m','7','m7'],OT=['maj7','sus4','sus2','dim','aug','6','add9'];
        if(!MAIN.includes(pk.typ)&&!OT.includes(pk.typ))OT.push(pk.typ);
        const r3=rw('fit'),nm=pk.root+pk.acc;
        MAIN.forEach(x=>r3.append(btn(nm+x,()=>{pk.typ=x;render()},'b pk'+(pk.typ===x?' on':''))));
        r3.append(drop('אחר',!MAIN.includes(pk.typ),'oo',OT.map(x=>[nm+x,pk.typ===x,()=>{pk.typ=x;render()}])));
        b.append(r3);
      }
    }
  }
  const spc=el('div');spc.style.height='calc(260px + env(safe-area-inset-bottom,0px))';A.append(spc,b);
}

function edit(){
  const s=cur,top=el('div','bar');
  top.append(btn('ביטול',()=>{v='list';render()}),el('b','tt',s.title||'שיר חדש'),
    btn('שמור',()=>{sync();s.title=s.title.trim()||'ללא שם';s.upd=Date.now();const i=S.findIndex(x=>x.id===s.id);i<0?S.push(s):S[i]=s;sv();cur=s;v='vw';t=s.tp||0;render()},'b pr'));
  A.append(top);
  const inp=(k,ph)=>{const i=el('input','f');i.placeholder=ph;i.value=s[k]||'';i.oninput=()=>{s[k]=i.value;if(k==='title')top.querySelector('.tt').textContent=i.value||'שיר חדש'};return i};
  const dt=btn(s.dir==='rtl'?'עב':'EN',()=>{s.dir=s.dir==='rtl'?'ltr':'rtl';s.dset=true;render()},'b','כיוון כתיבה: '+(s.dir==='rtl'?'עברית':'אנגלית')+' (לחץ להחלפה)');
  const row=el('div','row');row.append(inp('title','שם השיר'),dt);
  const tb=el('div','tabs');
  [['l','מילים'],['c','אקורדים']].forEach(([k,x])=>tb.append(btn(x,()=>{
    if(k==='c')sync();else if(s.raw==null)s.raw=s.lines.filter(l=>l.ty!=='c').map(l=>l.t).join('\n');
    tab=k;pk=null;render()},'b'+(tab===k?' on':''))));
  const cs2=el('select','f');cs2.style.cssText='flex:none;width:auto';cs2.setAttribute('aria-label','קאפו');
  for(let i=0;i<=12;i++){const o=el('option','',i?'קאפו '+i:'ללא קאפו');o.value=i;cs2.append(o)}
  cs2.value=s.cp||0;cs2.onchange=()=>{s.cp=+cs2.value||undefined};
  const r2=el('div','row');r2.append(inp('artist','אמן (לא חובה)'),cs2);
  const ps=el('select','f');ps.style.cssText='flex:none;width:auto';ps.setAttribute('aria-label','פרטיות');
  [['pub','ציבורי'],['priv','פרטי']].forEach(([x,y])=>{const o=el('option','',y);o.value=x;ps.append(o)});
  ps.value=s.priv?'priv':'pub';ps.onchange=()=>{s.priv=ps.value==='priv'||undefined};
  const r3=el('div','row');r3.append(inp('link','קישור לשיר (לא חובה)'),ps);
  A.append(row,r2,r3,tb);
  if(tab==='l'){
    if(s.raw==null)s.raw=s.lines.filter(l=>l.ty!=='c').map(l=>l.t).join('\n');
    const ta=el('textarea','f');ta.value=s.raw;ta.placeholder='הדבק כאן את מילות השיר';ta.dir=s.dir;
    ta.oninput=()=>{s.raw=ta.value;if(!s.dset){s.dir=detect(ta.value);ta.dir=s.dir;dt.textContent=s.dir==='rtl'?'עב':'EN'}};
    A.append(ta);
  }else{
    A.append(el('div','hint','לחץ על אות לבחירת אקורד מעליה. התא המקווקו בשוליים לפני השורה מחזיק אקורד אחד, והתא בסוף השורה מחזיק כמה אקורדים. כפתור ＋ בתחילת שורה מוסיף מעליה שורת אקורדים ללא מילים. לחיצה על אקורד קיים פותחת אותו לעריכה.'));
    const gap=i=>btn('＋',()=>{s.lines.splice(i,0,{t:'',c:{},ty:'c',x:[],lab:''});pk={li:i,k:'x',j:null};render()},'gap','הוסף שורת אקורדים');
    s.lines.forEach((l,i)=>{const r=el('div','er');r.dir=s.dir;r.append(gap(i),rl(l,s.dir,true,i));A.append(r)});
    const e=el('div','er');e.dir=s.dir;e.append(gap(s.lines.length));A.append(e);
    if(pk)picker();
    fix(A);
  }
}

function render(){
  if(closeP)closeP(false);onChord=null;closeP=null;
  metroStop();updCamBtn=()=>{};if(cam&&!(v==='vw'&&cur&&cur.id===cam.songId))camClose();
  const k=v+tab+(cur&&cur.id),y=k===pv?scrollY:0;pv=k;
  A.textContent='';({list,vw:view,ed:edit,set:settings,gal:gallery})[v]();scrollTo(0,y);
  if(v==='ed'&&tab==='c'&&pk){const e=A.querySelector('.cl.sel,.cc.on');
    if(e){const r=e.getBoundingClientRect(),lim=innerHeight-290;if(r.bottom>lim)scrollBy(0,r.bottom-lim+16);else if(r.top<90)scrollBy(0,r.top-110)}}
}
document.addEventListener('click',e=>{
  if(v!=='ed'||tab!=='c'||!pk)return;
  if((pk.bo||pk.oo)&&!e.target.closest('.flw')){pk.bo=pk.oo=false;render();return}
  if(!e.target.closest('.cb,.cl,.cd,.cc,.gap,.b')){pk=null;render()}
});
let pinch=null,wt=0;
const zoomTo=(nf,done)=>{if(v!=='vw')return;fs=Math.min(60,Math.max(12,nf));const bd=A.querySelector('.bd');if(bd){bd.style.fontSize=fs+'px';if(done)fix(bd)}};
const tdist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
document.addEventListener('touchstart',e=>{if(v==='vw'&&e.touches.length===2){pinch={d:tdist(e)||1,f:fs};if(closeP)closeP(true)}},{passive:true});
document.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();zoomTo(pinch.f*tdist(e)/pinch.d)}},{passive:false});
document.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2){pinch=null;zoomTo(fs,true)}});
document.addEventListener('touchcancel',()=>{if(pinch){pinch=null;zoomTo(fs,true)}});
document.addEventListener('gesturestart',e=>{if(v==='vw')e.preventDefault()});
document.addEventListener('gesturechange',e=>{if(v==='vw')e.preventDefault()});
document.addEventListener('wheel',e=>{if(v==='vw'&&e.ctrlKey){e.preventDefault();zoomTo(fs*Math.exp(-e.deltaY*.01));clearTimeout(wt);wt=setTimeout(()=>zoomTo(fs,true),150)}},{passive:false});
render();
(async()=>{try{const sh=await readLink();if(sh){incoming=sh;cur=sh;t=0;v='vw';try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}render()}}catch(e){}})();
</script>
</body>
